<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda online de juegos digitales para PC con ofertas y lanzamientos.">
    <meta name="keywords"content="videojuegos, juegos digitales, comprar juegos, tienda de juegos, PC gaming, juegos online, plataforma de juegos">
    <meta name="author" content="Milagros Acuña,Matias Salinas,Luca Zanetti ,Ignacio Guanca">
    <title>GG Store</title>
</head>
<body>
    <main>
        <section class="d-flex align-items-center justify-content-center bg-dark contenedor-registro">
            <div class="container my-5">
                <div class="row bg-body-tertiary shadow-lg rounded mx-auto" style="max-width: 1500px;">
                    <div class="col-lg-7 col-md-12 p-5 bg-body-tertiary">
                
                        <h2 class="mb-4 text-light fw-bolder">Crea tu Cuenta</h2>
                        <p class="mb-4 text-muted">Únete a GG Store y accede a ofertas exclusivas.</p>

                    <form>
                        <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="nombre" class="form-label text-light">Nombre</label>
                            <input type="text" class="form-control bg-secondary text-light border-0" id="nombre" placeholder="Ej: Matias" minlength="2"
                            maxlength="25" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label text-light">Apellido</label>
                            <input type="text" class="form-control bg-secondary text-light border-0" id="apellido" placeholder="Ej: Ramirez" minlength="2"
                            maxlength="25" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="usuario" class="form-label text-light">Nombre de Usuario</label>
                            <input type="text" class="form-control bg-secondary text-light border-0" id="usuario" placeholder="Ej: gamerpro123" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label text-light">Email</label>
                            <input type="email" class="form-control bg-secondary text-light border-0" id="email" placeholder="email@email.com" minlength="2"
                        maxlength="25" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="telefono" class="form-label text-light">Teléfono</label>
                            <input type="tel" class="form-control bg-secondary text-light border-0" id="telefono" placeholder="Ej: 3814445556"required>
                        </div>
                        <div class="col-md-6">
                            <label for="codigopostal" class="form-label text-light">Código Postal</label>
                            <input type="text" class="form-control bg-secondary text-light border-0" id="codigopostal" placeholder="Ej: 4168" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="domicilio" class="form-label text-light">Domicilio (Calle y Número)</label>
                        <input type="text" class="form-control bg-secondary text-light border-0" id="domicilio" placeholder="Ej: Av. Principal 1234" required>
                    </div>

                    <div class="mb-4">
                        <label for="contraseña" class="form-label text-light">Contraseña</label>
                        <input type="password" class="form-control bg-secondary text-light border-0" id="contraseña" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-lg w-100 fw-bold mb-3" 
                            style="background: linear-gradient(to right, #8f3173c0, #fa80e6c9); border: none;">
                        Registrarse
                    </button>
                    </form>
                   </div> 
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
